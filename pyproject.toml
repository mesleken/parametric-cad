[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pcad"
version = "0.3.0"
description = "Deterministic Parametric CAD Desktop Application with Engineering Verification"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "build123d>=0.13.0",
    "PySide6-Essentials>=6.12.0",
    "pyvista>=0.49.0",
    "pyvistaqt>=0.13.0",
    "pydantic>=2.10.0",
    "reportlab>=5.0.0",
    "platformdirs>=4.0.0",
    "numpy>=2.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pyinstaller>=6.0.0"
]

[project.scripts]
pcad = "pcad.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pcad = [
    "domain/data/*.json",
    "templates/builtin/**/*.py",
    "docs/**/*.md"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
